AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Identity Center demo fixture for the Ranger -> Lake Formation assessment tool.
  Creates Identity Center users and groups named identically to the principals in
  Idc_Demo_Ranger_Policies.json, plus the Glue databases, tables, and columns
  those policies reference.

  Generated by demo/idc/generate_idc_demo.py - do not edit by hand.

Parameters:

  ExistingIdentityStoreId:
    Type: String
    Default: ''
    Description: >-
      Identity store ID of an Identity Center instance that already exists
      (e.g. d-1234567890). Leave empty to have this stack create an
      ACCOUNT-level instance instead.

      An account instance CANNOT be created from an AWS Organizations
      management account - CreateInstance rejects it. If this account manages an
      organization, enable an ORGANIZATION instance in the Identity Center
      console first and pass its identity store ID here. Doing so also keeps the
      instance outside this stack's lifecycle, so deleting the stack leaves it
      intact.

  DataBucketName:
    Type: String
    Default: acme-idc-demo-427250191192
    Description: >-
      Bucket backing the Glue table locations. No objects are written; the
      tables exist so the assessment can expand wildcards against real metadata.

Conditions:

  CreateIdcInstance: !Equals [!Ref ExistingIdentityStoreId, '']

Resources:

  # ------------------------------------------------------------------
  # Identity Center
  # ------------------------------------------------------------------

  IdcInstance:
    Type: AWS::SSO::Instance
    Condition: CreateIdcInstance
    Properties:
      Name: acme-ranger-lf-demo
      Tags:
        - Key: Purpose
          Value: ranger-to-lakeformation-demo

  # Groups. DisplayName is what IdentityCenterPrincipalMapper passes to
  # GetGroupId, so each one equals a Ranger group name exactly.

  GroupDataAnalysts:
    Type: AWS::IdentityStore::Group
    Properties:
      IdentityStoreId: !If [CreateIdcInstance, !GetAtt IdcInstance.IdentityStoreId, !Ref ExistingIdentityStoreId]
      DisplayName: data_analysts
      Description: Self-service analysts querying curated marts

  GroupDataEngineers:
    Type: AWS::IdentityStore::Group
    Properties:
      IdentityStoreId: !If [CreateIdcInstance, !GetAtt IdcInstance.IdentityStoreId, !Ref ExistingIdentityStoreId]
      DisplayName: data_engineers
      Description: Owns the raw and refined layers

  GroupBiDevelopers:
    Type: AWS::IdentityStore::Group
    Properties:
      IdentityStoreId: !If [CreateIdcInstance, !GetAtt IdcInstance.IdentityStoreId, !Ref ExistingIdentityStoreId]
      DisplayName: bi_developers
      Description: Builds dashboards on top of curated tables

  GroupMlEngineers:
    Type: AWS::IdentityStore::Group
    Properties:
