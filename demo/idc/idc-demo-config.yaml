# Assessment configuration for the Identity Center demo fixture.
#
#   java -jar target/assessment-jar-with-dependencies.jar \
#       file demo/idc/Idc_Demo_Ranger_Policies.json \
#       --config demo/idc/idc-demo-config.yaml \
#       --aws-region us-east-1 --aws-profile hocanint+ranger-test1 \
#       --console-only
#
# Unlike demo/demo-config.yaml, this one resolves principals through the live
# IdentityStore API instead of a static lookup table. Every user name below is an
# Identity Center `userName` and every group name a group `displayName`, both
# created by idc-demo-resources.yaml.
#
# identityStoreId must match the IdentityStoreId output of the deployed stack.
#
# Generated by demo/idc/generate_idc_demo.py - identityStoreId is edited in place
# after deployment.

# catalogId must be set: the adapters build Glue ARNs by string-concatenating it, so
# leaving it unset yields ARNs containing the literal text "null" and a catalogId of
# "null" on every projected grant.
awsConfig:
  region: us-east-1
  catalogId: "0123456789012"

rangerServices:
  - serviceType: hive
    serviceInstanceName: acme_hive
  - serviceType: trino
    serviceInstanceName: acme_trino
    gdcCatalogName: awsdatacatalog

principalMapping:
  type: IDENTITY_CENTER
  idcConfig:
    identityStoreId: d-01234567
    region: us-east-1
    accountId: "0123456789012"
    cacheTtlMinutes: 60
